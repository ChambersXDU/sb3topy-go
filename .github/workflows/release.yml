name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Test Python runtime
        run: python3 -B -m unittest discover -s tests -v

      - name: Build Binaries
        run: |
          mkdir -p build
          GOOS=darwin GOARCH=arm64 go build -o build/sb3topy-darwin-arm64
          GOOS=darwin GOARCH=amd64 go build -o build/sb3topy-darwin-amd64
          GOOS=windows GOARCH=amd64 go build -o build/sb3topy-windows-amd64.exe
          GOOS=linux GOARCH=amd64 go build -o build/sb3topy-linux-amd64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/sb3topy-darwin-arm64
            build/sb3topy-darwin-amd64
            build/sb3topy-windows-amd64.exe
            build/sb3topy-linux-amd64
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
