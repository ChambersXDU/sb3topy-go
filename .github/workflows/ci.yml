name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Test
        run: go test ./...

      - name: Test Python runtime
        run: python3 -B -m unittest discover -s tests -v

      - name: Build
        run: go build ./...
